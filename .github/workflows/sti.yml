name: Captura STI San Antonio
on:
  schedule:
    - cron: '40 17 * * *'   # 14:40 Chile (verano) / 13:40 (invierno)
    - cron: '40 19 * * *'   # reintento 16:40 / 15:40
  workflow_dispatch:
permissions:
  contents: write
concurrency: datos
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sti.mjs
      - name: Diagnóstico si falla
        if: failure()
        run: grep -o -i '.\{0,400\}SITIO.\{0,900\}' /tmp/sti.html | head -c 4000 || true
      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sti.json
          git diff --cached --quiet || git commit -m "Datos STI $(date -u +'%F %H:%M') UTC"
          git pull --rebase && git push
