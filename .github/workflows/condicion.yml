name: Condición de puertos
on:
  schedule:
    - cron: '20 */3 * * *'   # cada 3 horas
  workflow_dispatch:
permissions:
  contents: write
concurrency: datos
jobs:
  condicion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/condicion.mjs
        env:
          OPEN_METEO_KEY: ${{ secrets.OPEN_METEO_KEY }}
      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/condicion.json
          git diff --cached --quiet || git commit -m "Condición puertos $(date -u +'%F %H:%M') UTC"
          git pull --rebase && git push
